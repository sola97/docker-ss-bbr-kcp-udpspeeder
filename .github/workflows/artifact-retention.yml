name: Keep latest Actions artifact

on:
  workflow_run:
    workflows: ['*', '!Keep latest Actions artifact']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: repository-artifact-retention
  cancel-in-progress: false

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select latest completed build and prepare bundle
        id: prepare
        uses: actions/github-script@v9
        with:
          script: |
            // Only completed runs participate: active runs still need their intermediate artifacts.
            async function selectArtifacts({ artifacts, getRun, now = Date.now() }) {
              const cutoff = now - 7 * 24 * 60 * 60 * 1000;
              const runs = new Map();
              const completed = [];
              const artifactSources = {};
              for (const artifact of artifacts) {
                if (artifact.expired || !artifact.workflow_run) continue;
                const runId = artifact.workflow_run.id;
                if (!runs.has(runId)) runs.set(runId, await getRun(runId));
                if (runs.get(runId).status !== 'completed') continue;
                if (runs.get(runId).path === '.github/workflows/artifact-retention.yml') {
                  const match = /^latest-run-(\d+)-(\d+)-(\d+)$/.exec(artifact.name);
                  if (match) {
                    const sourceId = Number(match[1]);
                    if (!runs.has(sourceId)) runs.set(sourceId, await getRun(sourceId));
                    if (runs.get(sourceId).status !== 'completed') continue;
                    artifactSources[artifact.id] = sourceId;
                  }
                }
                completed.push(artifact);
              }
              const eligible = completed.filter((artifact) =>
                Date.parse(artifact.created_at) > cutoff && !artifact.name.endsWith('.dockerbuild')
              );
              const groups = new Map();
              for (const artifact of eligible) {
                const artifactRun = runs.get(artifact.workflow_run.id);
                const fromRetentionWorkflow = artifactRun.path === '.github/workflows/artifact-retention.yml';
                const match = fromRetentionWorkflow ? /^latest-run-(\d+)-(\d+)-(\d+)$/.exec(artifact.name) : null;
                const sourceId = match ? Number(match[1]) : artifact.workflow_run.id;
                const created = match ? Number(match[2]) : Date.parse(runs.get(sourceId).created_at);
                // Artifact age controls retention; rerunning an older workflow creates fresh artifacts.
                const attempt = match ? Number(match[3]) : runs.get(sourceId).run_attempt;
                const key = `${sourceId}:${attempt}`;
                if (!groups.has(key)) groups.set(key, { sourceId, created, attempt, artifacts: [] });
                groups.get(key).artifacts.push(artifact);
              }
              const keys = [...groups.keys()].sort((a, b) =>
                groups.get(b).created - groups.get(a).created ||
                groups.get(b).sourceId - groups.get(a).sourceId || groups.get(b).attempt - groups.get(a).attempt
              );
              const runAttempts = Object.fromEntries([...runs].map(([id, run]) => [id, run.run_attempt]));
              if (keys.length === 0) return { sourceId: null, sources: [], keepId: null, completed, runAttempts, artifactSources };
              const group = groups.get(keys[0]);
              const { sourceId, attempt: sourceAttempt, created: sourceCreated } = group;
              const sources = [...group.artifacts];
              const currentBundle = sources.find((artifact) => artifact.name === `latest-run-${sourceId}-${sourceCreated}-${sourceAttempt}`);
              // Failed matrix jobs can rerun alone: merge previous successful outputs with new outputs.
              if (!currentBundle) {
                for (const older of groups.values()) {
                  if (older.sourceId !== sourceId || older.attempt >= sourceAttempt) continue;
                  const previous = older.artifacts.find((artifact) => artifact.name === `latest-run-${sourceId}-${sourceCreated}-${older.attempt}`);
                  if (previous) sources.push(previous);
                }
              }
              const bundleName = `latest-run-${sourceId}-${sourceCreated}-${sourceAttempt}`;
              const bundle = sources.find((artifact) => artifact.name === bundleName);
              // A valid existing bundle or single original artifact needs no extra upload.
              const single = bundle || (sources.length === 1 ? sources[0] : null);
              const expiresWithinSevenDays = single &&
                Date.parse(single.expires_at) <= Date.parse(single.created_at) + 7 * 24 * 60 * 60 * 1000 + 60000;
              return { sourceId, sourceCreated, sourceAttempt, bundleName, sources, keepId: expiresWithinSevenDays ? single.id : null, completed, runAttempts, artifactSources };
            }
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const plan = await selectArtifacts({
              artifacts,
              getRun: async (run_id) => (await github.rest.actions.getWorkflowRun({ owner, repo, run_id })).data
            });
            const root = path.join(process.env.RUNNER_TEMP, 'retained-artifact');
            const planPath = path.join(process.env.RUNNER_TEMP, 'artifact-retention-plan.json');
            fs.writeFileSync(planPath, JSON.stringify(plan));
            core.setOutput('keep-id', plan.keepId || '');
            core.setOutput('upload', plan.sources.length > 0 && !plan.keepId ? 'true' : 'false');
            core.setOutput('bundle-name', plan.bundleName || '');
            core.setOutput('bundle-path', root);
            if (plan.sources.length === 0 || plan.keepId) return;
            fs.mkdirSync(root, { recursive: true });
            const manifest = { sourceRunId: plan.sourceId, sourceCreatedAt: plan.sourceCreated, sourceAttempt: plan.sourceAttempt, artifacts: [] };
            const filesByName = new Map();
            const previousBundles = plan.sources.filter((artifact) => /^latest-run-\d+-\d+-\d+$/.test(artifact.name));
            const originals = plan.sources.filter((artifact) => !previousBundles.includes(artifact));
            previousBundles.sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
            for (const artifact of previousBundles) {
              const run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: artifact.workflow_run.id })).data;
              if (run.path !== '.github/workflows/artifact-retention.yml') {
                originals.push(artifact);
                continue;
              }
              const archive = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: artifact.id, archive_format: 'zip' });
              const archivePath = path.join(process.env.RUNNER_TEMP, `previous-${artifact.id}.zip`);
              fs.writeFileSync(archivePath, Buffer.from(archive.data));
              const output = await exec.getExecOutput('unzip', ['-p', archivePath, 'manifest.json'], { silent: true });
              const previous = JSON.parse(output.stdout);
              if (previous.sourceRunId !== plan.sourceId) throw new Error('Previous bundle source mismatch');
              for (const item of previous.artifacts) {
                if (!/^\d+\.zip$/.test(item.filename)) throw new Error('Invalid original archive filename');
                const destination = path.join(root, item.filename);
                const fd = fs.openSync(destination, 'w');
                try {
                  await exec.exec('unzip', ['-p', archivePath, item.filename], { silent: true, listeners: { stdout: (data) => fs.writeSync(fd, data) } });
                } finally { fs.closeSync(fd); }
                filesByName.set(item.name, item);
              }
            }
            for (const artifact of originals) {
              const archive = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: artifact.id, archive_format: 'zip' });
              const filename = `${artifact.id}.zip`;
              fs.writeFileSync(path.join(root, filename), Buffer.from(archive.data));
              filesByName.set(artifact.name, { id: artifact.id, name: artifact.name, filename, createdAt: artifact.created_at });
            }
            manifest.artifacts = [...filesByName.values()];
            const filenames = new Set(manifest.artifacts.map((item) => item.filename));
            for (const filename of fs.readdirSync(root)) {
              if (!filenames.has(filename)) fs.unlinkSync(path.join(root, filename));
            }
            // Keep original ZIPs intact: untrusted artifacts are never extracted or executed.
            fs.writeFileSync(path.join(root, 'manifest.json'), JSON.stringify(manifest, null, 2));

      - name: Upload one complete artifact
        id: bundle
        if: steps.prepare.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.bundle-name }}
          path: ${{ steps.prepare.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove superseded completed-run artifacts
        uses: actions/github-script@v9
        env:
          RETAINED_ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id || steps.prepare.outputs.keep-id }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const plan = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'artifact-retention-plan.json'), 'utf8'));
            const keepId = process.env.RETAINED_ARTIFACT_ID;
            if (plan.sources.length > 0 && !keepId) throw new Error('No retained artifact; refusing to delete source files');
            const runStates = new Map();
            for (const artifact of plan.completed) {
              if (String(artifact.id) === keepId) continue;
              const runId = artifact.workflow_run.id;
              if (!runStates.has(runId)) {
                const run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId })).data;
                runStates.set(runId, run.status === 'completed' && run.run_attempt === plan.runAttempts[runId]);
              }
              if (!runStates.get(runId)) {
                core.info(`Preserved artifacts of active or rerun workflow ${runId}`);
                continue;
              }
              const sourceId = plan.artifactSources[artifact.id];
              if (sourceId) {
                const source = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: sourceId })).data;
                if (source.status !== 'completed' || source.run_attempt !== plan.runAttempts[sourceId]) {
                  core.info(`Preserved retained bundle needed by active or rerun source ${sourceId}`);
                  continue;
                }
              }
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted ${artifact.name} (${artifact.id})`);
            }
            core.summary.addHeading('Actions artifact retention');
            core.summary.addRaw(keepId ? `Retained one artifact: ${keepId}. Retention: 7 days.` : 'No completed-run artifacts within 7 days.');
            await core.summary.write();
